name: Reload Caddy

on:
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    steps:
      - name: Reload Caddy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || docker exec reverse-proxy-caddy-caddy-1 caddy reload --config /etc/caddy/Caddyfile 2>/dev/null \
              || docker ps --format '{{.Names}}' | grep -i caddy | xargs -I{} docker exec {} caddy reload --config /etc/caddy/Caddyfile
            echo ">>> Caddy reloaded"
