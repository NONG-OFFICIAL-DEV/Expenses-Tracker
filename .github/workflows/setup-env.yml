name: Setup Server .env

on:
  workflow_dispatch:
    inputs:
      postgres_password:
        description: "POSTGRES_PASSWORD"
        required: true
      jwt_access_secret:
        description: "JWT_ACCESS_SECRET"
        required: true
      jwt_refresh_secret:
        description: "JWT_REFRESH_SECRET"
        required: true

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
          JWT_ACCESS_SECRET: ${{ inputs.jwt_access_secret }}
          JWT_REFRESH_SECRET: ${{ inputs.jwt_refresh_secret }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: POSTGRES_PASSWORD,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET
          script: |
            mkdir -p ~/expense-tracker
            cat > ~/expense-tracker/.env << EOF
            POSTGRES_USER=expense
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=expense_tracker
            JWT_ACCESS_SECRET=$JWT_ACCESS_SECRET
            JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
            WEB_ORIGIN=https://budget.nexstacktech.com
            EOF
            echo ">>> .env written:"
            cat ~/expense-tracker/.env
